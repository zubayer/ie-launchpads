name: Deploy V2 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays 11:17 UTC (early morning in the US): refresh the "IE jobs this week" card.
    - cron: '17 11 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The V1/V2 switch links here. V1 is read-only; this only sets where the link points.
      VITE_V1_URL: https://zubayer.github.io/ie-launchpad/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect this week's IE job postings (never fails the build)
        run: node scripts/fetch-jobs.mjs
        continue-on-error: true
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
